# V1 persona profiles: 12 anonymous jingcheng-style prototypes.
# These drive persona routing, NOT rule adjudication.

personality_dimensions:
  - personality
  - speech_style
  - risk_tolerance
  - deception_skill
  - logic_skill
  - leadership
  - emotion_control
  - learning_rate

persona_profiles:
  logic_leader:
    display_name: 强逻辑归票型
    base:
      personality: analytical_leader
      speech_style: structured_logical
      risk_tolerance: 0.45
      deception_skill: 0.30
      logic_skill: 0.92
      leadership: 0.88
      emotion_control: 0.80
      learning_rate: 0.65
    task_styles:
      speech: structured_reasoning
      vote: decisive_reasoned
      night_action: methodical
      deception: low_deception
      sheriff_speech: authority_claim
      defense_speech: logical_rebuttal
      last_words: concise_summary
      reflection: data_driven_review
    dynamic_policy:
      when_suspected:
        aggression_delta: 0.05
        speech_length_delta: 0.1
      when_teammate_exiled:
        risk_tolerance_delta: -0.10
      when_trusted_by_good_players:
        leadership_delta: 0.05

