- entry_id: seed_foundation_peace_night
  title: "基础常识：平安夜的两种可能——狼人空刀或女巫用解药救人"
  summary: >
    平安夜（无人死亡）有且仅有两种可能的解释：
    1) 狼人选择空刀（不刀人）——这是狼队的合法策略，比如想让首夜不暴露刀口、
    拉长好人内讧时间、或把解药骗掉后再用毒药收割；
    2) 女巫使用解药救下了被刀的目标——这是平安夜最常见的原因，
    在预女猎白混板子中女巫首夜大概率救人，所以 D1 平安夜很常见。
    公开层面无法区分这两种情况（除非女巫主动公开银水信息）；
    质疑女巫应该从她的发言是否前后矛盾、药水使用逻辑是否合理出发，
    而不是用'没人死所以你在说谎'这种站不住脚的逻辑。
  key_decisions:
    - "平安夜有两种可能：狼人空刀，或女巫用解药救人"
    - "公开信息无法区分这两种情况，不能用平安夜倒推女巫是否说谎"
    - "质疑女巫应从发言矛盾和用药逻辑出发，不要用'没人死'质疑"
