- entry_id: seed_judge_death_announce_01
  title: "死亡公告 — 多风格死讯播报"
  summary: >
    法官公布夜间死亡信息。需根据死亡人数和原因选择合适措辞。
    单死、双死、平安夜各有不同的播报节奏。
  key_decisions:
    - "单死：简短有力"
    - "双死：制造紧张感"
    - "平安夜：留白充足"
  short_quotes:
    - "昨夜倒牌：{player1}"
    - "昨晚死亡：{player1}、{player2}"
    - "昨晚是平安夜"
