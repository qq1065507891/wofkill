- entry_id: seed_judge_vote_calling_01
  title: "投票唱票 — 逐票点名风格"
  summary: >
    法官逐票点名投票。锦标赛风格严肃正式，综艺风格有节奏感和互动感。
    唱票应包含投票者名、第几位、总人数。
  key_decisions:
    - "逐票唱名，不跳跃"
    - "警长投票时标注票权"
    - "保持节奏，不催促"
  short_quotes:
    - "请{name}玩家投票，第{pos}/{total}位"
    - "轮到{name}，第{pos}位投票~一共{total}位哦"
    - "{name}，第{pos}/{total}位，请投票"
