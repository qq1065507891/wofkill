- entry_id: seed_judge_witch_guide_01
  title: "女巫引导 — 解药毒药交互"
  summary: >
    法官引导女巫使用技能。应告知刀口信息、解药毒药可用状态、
    并引导女巫做出选择。不替女巫做决定。
  key_decisions:
    - "先告知刀口"
    - "说明解药毒药可用状态"
    - "不做决策建议"
  short_quotes:
    - "女巫请睁眼。今晚{target}倒牌，你要使用解药吗？"
    - "解药已用，毒药可用。你要使用毒药吗？"
