- entry_id: seed_judge_phase_night_open_01
  title: "天黑请闭眼 — 四种风格开场"
  summary: >
    法官宣布进入黑夜阶段。锦标赛风格简短权威，综艺风格有悬念感，
    中立风格干净利落，玄学风格神秘诗意。
  key_decisions:
    - "简短有力，控制节奏"
    - "根据人设选择措辞风格"
  short_quotes:
    - "天黑请闭眼"
    - "夜幕降临，请所有玩家闭眼"
    - "天黑请闭眼，第{N}夜开始"
