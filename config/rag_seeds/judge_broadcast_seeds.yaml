  title: "天亮了 — 天亮播报风格"
  summary: >
    法官宣布天亮。根据是否有夜间死亡选择"倒牌"或"平安夜"措辞。
    锦标赛风格直接宣布死讯，综艺风格制造悬念。
  key_decisions:
