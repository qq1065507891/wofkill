# V1 real-run model routing.
# Provider/model names are configuration only. API keys stay in .env.
#
# Ark (Volcengine) OpenAI-compatible endpoint — set in .env:
#   OPENAI_BASE_URL=https://ark.cn-beijing.volces.com/api/coding/v3
#   OPENAI_API_KEY=<ark api key>

model_profiles:
  # --- Ark (Volcengine) models (OpenAI-compatible) ---
  # Models randomly assigned across the 4 player-routing llm_profiles
  # (deepseek/minimax/glm/kimi) per request — names are routing labels,
  # the `model:` field is the actual Ark model id.
  #
  # NEW (2026-07-15, ark-dedup): the two Ark profiles that previously
  # wrapped MiniMax models (``ark_minimax_m3`` → ``minimax-m3`` and
  # ``ark_minimax_m2_7`` → ``minimax-m2.7``) were renamed and the
  # ``model:`` field swapped to non-MiniMax IDs so the Ark endpoint
  # doesn't shadow the new native-minimax routing. The 4 Ark model IDs
  # now read: Kimi-K2.6, deepseek-v4-flash, deepseek-v4-pro,
  # DeepSeek-V4-Pro. The internal Ark duplicate (two profiles with
  # deepseek-v4-pro) is intentional — the secondary profile carries
  # slightly higher temperature / top_p so it's a distinct sampling
  # channel, not a copy.
  ark_kimi_k26:
    provider: openai
    model: Kimi-K2.6
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  ark_deepseek_v4_flash:
    provider: openai
    model: deepseek-v4-flash
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  ark_deepseek_v4_pro:
    provider: openai
    model: deepseek-v4-pro
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  ark_deepseek_v4_pro_secondary:
    provider: openai
    model: DeepSeek-V4-Pro
    temperature: 0.6
    top_p: 0.95
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  # --- Native MiniMax (OpenAI-compatible endpoint api.minimaxi.com/v1) ---
  # NEW (2026-07-15, native-minimax-routing): 5 players are routed through
  # ``https://api.minimaxi.com/v1`` using the OpenAI client pattern from
  # the user's MiniMax docs (model="MiniMax-M3" / "MiniMax-M2.7", extra
  # ``reasoning_split=True`` to surface thinking via reasoning_details).
  # Per-profile ``base_url`` and ``extra_body`` are read by ``_resolve_config``
  # and forwarded by every provider's ``generate()`` (see
  # ``werewolf_agent/model_gateway/`` for the plumbing).
  minimax_native_m3:
    provider: openai
    model: MiniMax-M3
    base_url: https://api.minimaxi.com/v1
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    extra_body:
      reasoning_split: true
    structured_output:
      mode: text_json
      fallback_modes: []

  minimax_native_m2_7:
    provider: openai
    model: MiniMax-M2.7
    base_url: https://api.minimaxi.com/v1
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    extra_body:
      reasoning_split: true
    structured_output:
      mode: text_json
      fallback_modes: []

  # --- MiniMax (Anthropic-compatible) ---
  minimax_m27_default:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  minimax_m27_reflection:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.4
    top_p: 0.9
    timeout: 180
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  minimax_m27_fast:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.7
    top_p: 0.95
    timeout: 90
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

llm_profiles:
  # --- Ark profiles (player routing; random model assignment) ---
  ark_deepseek:
    default:
      provider: openai
      model_profile: ark_kimi_k26
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  ark_minimax:
    default:
      provider: openai
      model_profile: ark_deepseek_v4_flash
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  ark_glm:
    default:
      provider: openai
      model_profile: ark_deepseek_v4_pro
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  ark_kimi:
    default:
      provider: openai
      model_profile: ark_deepseek_v4_pro_secondary
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  # --- Native MiniMax profiles (OpenAI-compatible api.minimaxi.com/v1) ---
  # NEW (2026-07-15, native-minimax-routing): 5 players (p01/p03/p06/p08/p10)
  # are routed through ``https://api.minimaxi.com/v1`` instead of the Ark
  # endpoint. Fixed 3:2 split (M3 : M2.7) approximates the requested 2:1
  # weight with 5 players; persona logic / fast-burst personas got M2.7.
  # fallback goes to native MiniMax Anthropic-compatible endpoint
  # (different provider_name, so the v1.1.4 cross-provider rule holds).
  minimax_native_m3:
    default:
      provider: openai
      model_profile: minimax_native_m3
    fallback:
      provider: minimax
      model_profile: minimax_m27_default

  minimax_native_m2_7:
    default:
      provider: openai
      model_profile: minimax_native_m2_7
    fallback:
      provider: minimax
      model_profile: minimax_m27_default

  # --- MiniMax profiles ---
  # NEW (v1.1.4 fallback-fix, Part C.1):
  # ``minimax`` provider (calling ``MiniMax-M2.7``) failed on 154/618
  # attempts (24.9%) with ``root_cause=invalid_output`` in 4 games
  # captured on/after 2026-07-14.  ``MiniMax-M3`` (Ark OpenAI-compatible
  # endpoint) is more reliable, so we now route the player default
  # through the ``openai`` provider instead of the native ``minimax``
  # provider.  ``reflection`` task keeps the M2.7 native endpoint as
  # a fallback (cross-version diverse provider signals help the
  # reflection synthesizer avoid single-provider bias).
  minimax_default:
    default:
      provider: openai
      model_profile: ark_kimi_k26
    tasks:
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
      speech:
        provider: openai
        model_profile: ark_kimi_k26
      deception:
        provider: openai
        model_profile: ark_kimi_k26
      night_action:
        provider: openai
        model_profile: ark_kimi_k26
      # Phase 2 P2-2: 5 JUDGE_* task types now map to the same
      # model as ``speech`` (per Phase 1 decision).  Judge
      # broadcasts are serial and don't need the extra quality of
      # the default profile, but routing them through a cheaper
      # model (e.g. ``minimax_m27_fast``) is an independent
      # optimisation that can be enabled in a follow-up.  Each
      # judge_* task type is listed explicitly so future per-task
      # tuning (different max_tokens, temperature, etc.) is
      # straightforward.
      judge_vote_calling:
        provider: minimax
        model_profile: minimax_m27_default
      judge_skill_guide:
        provider: minimax
        model_profile: minimax_m27_default
      judge_vote_tally:
        provider: minimax
        model_profile: minimax_m27_default
      judge_exile:
        provider: minimax
        model_profile: minimax_m27_default
      judge_sheriff:
        provider: minimax
        model_profile: minimax_m27_default
    # NEW (v1.1.4 fallback-fix, Part C.1):
    # fallback was previously ``minimax_m27_fast`` (same provider
    # as the old default — offered no actual model diversity when
    # the primary failed).  Now it routes to a different provider
    # (``openai`` + Ark deepseek-v4-flash) so a MiniMax outage
    # doesn't propagate.
    fallback:
      provider: openai
      model_profile: ark_deepseek_v4_flash

  # Backward-compatible aliases used by older tests/docs.
  pro_reasoner:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
      speech:
        provider: minimax
        model_profile: minimax_m27_default
      # Phase 2 P2-2: see comment in minimax_default above
      judge_vote_calling:
        provider: minimax
        model_profile: minimax_m27_default
      judge_skill_guide:
        provider: minimax
        model_profile: minimax_m27_default
      judge_vote_tally:
        provider: minimax
        model_profile: minimax_m27_default
      judge_exile:
        provider: minimax
        model_profile: minimax_m27_default
      judge_sheriff:
        provider: minimax
        model_profile: minimax_m27_default
    # NEW (v1.1.4 fallback-fix, Part C.1):
    # fallback was previously ``minimax_m27_fast`` (same provider
    # as the old default — offered no actual model diversity when
    # the primary failed).  Now it routes to a different provider
    # (``openai`` + Ark deepseek-v4-flash) so a MiniMax outage
    # doesn't propagate.
    fallback:
      provider: openai
      model_profile: ark_deepseek_v4_flash

  local_wolf:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      deception:
        provider: minimax
        model_profile: minimax_m27_fast
    fallback:
      provider: openai
      model_profile: ark_deepseek_v4_flash

  balanced:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      night_action:
        provider: minimax
        model_profile: minimax_m27_default
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
    fallback:
      provider: openai
      model_profile: ark_deepseek_v4_flash

# NEW (2026-07-15, native-minimax-routing): 5 players (p01/p03/p06/p08/p10)
# rerouted through ``https://api.minimaxi.com/v1``. Fixed 3:2 split
# (M3:M2.7) approximates the requested 2:1 weight; the persona mapping is:
#   M3 (reasoning-heavy): p01 logic_leader, p03 steady_sider, p08 review_learner
#   M2.7 (fast/intuitive): p06 emotional_catalyst, p10 burst_visionary
# The other 7 players keep their prior llm_profile assignments.
players:
  p01:
    persona_id: logic_leader
    llm_profile: minimax_native_m3
  p02:
    persona_id: aggressive_bluffer
    llm_profile: minimax_default
  p03:
    persona_id: steady_sider
    llm_profile: minimax_native_m3
  p04:
    persona_id: bold_pretender
    llm_profile: minimax_default
  p05:
    persona_id: deep_hooker
    llm_profile: ark_minimax
  p06:
    persona_id: emotional_catalyst
    llm_profile: minimax_native_m2_7
  p07:
    persona_id: chaos_joker
    llm_profile: ark_kimi
  p08:
    persona_id: review_learner
    llm_profile: minimax_native_m3
  p09:
    persona_id: quiet_observer
    llm_profile: minimax_default
  p10:
    persona_id: burst_visionary
    llm_profile: minimax_native_m2_7
  p11:
    persona_id: structure_analyst
    llm_profile: ark_glm
  p12:
    persona_id: adaptive_gamer
    llm_profile: minimax_default
  judge:
    persona_id: judge
    llm_profile: minimax_default
