# V1 real-run model routing.
enforce_player_reasoning: true
# Provider/model names are configuration only. API keys stay in .env.
#
# Ark (Volcengine) OpenAI-compatible endpoint — set in .env:
#   OPENAI_BASE_URL=https://ark.cn-beijing.volces.com/api/coding/v3
#   OPENAI_API_KEY=<ark api key>

model_profiles:
  # --- Ark (Volcengine) models (OpenAI-compatible) ---
  # Models randomly assigned across the 4 player-routing llm_profiles
  # (deepseek/minimax/glm/kimi) per request — names are routing labels,
  # the `model:` field is the actual Ark model id.
  ark_minimax_m3:
    provider: openai
    model: minimax-m3
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  ark_deepseek_v4_flash:
    provider: openai
    model: deepseek-v4-flash
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: medium
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  ark_deepseek_v4_pro:
    provider: openai
    model: deepseek-v4-pro
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  ark_minimax_m2_7:
    provider: openai
    model: minimax-m2.7
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  # --- MiniMax (Anthropic-compatible) ---
  minimax_m27_default:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.5
    top_p: 0.9
    timeout: 120
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  minimax_m27_reflection:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.4
    top_p: 0.9
    timeout: 180
    reasoning:
      level: high
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

  minimax_m27_fast:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.7
    top_p: 0.95
    timeout: 90
    reasoning:
      level: medium
    allow_text_tool_fallback: true
    structured_output:
      mode: text_json
      fallback_modes: []

llm_profiles:
  # --- Ark profiles (player routing; random model assignment) ---
  ark_deepseek:
    default:
      provider: openai
      model_profile: ark_minimax_m3
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  ark_minimax:
    default:
      provider: openai
      model_profile: ark_deepseek_v4_flash
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  ark_glm:
    default:
      provider: openai
      model_profile: ark_deepseek_v4_pro
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  ark_kimi:
    default:
      provider: openai
      model_profile: ark_minimax_m2_7
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  # --- MiniMax profiles ---
  minimax_default:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
      speech:
        provider: minimax
        model_profile: minimax_m27_default
      deception:
        provider: minimax
        model_profile: minimax_m27_fast
      night_action:
        provider: minimax
        model_profile: minimax_m27_default
      # Phase 2 P2-2: 5 JUDGE_* task types now map to the same
      # model as ``speech`` (per Phase 1 decision).  Judge
      # broadcasts are serial and don't need the extra quality of
      # the default profile, but routing them through a cheaper
      # model (e.g. ``minimax_m27_fast``) is an independent
      # optimisation that can be enabled in a follow-up.  Each
      # judge_* task type is listed explicitly so future per-task
      # tuning (different max_tokens, temperature, etc.) is
      # straightforward.
      judge_vote_calling:
        provider: minimax
        model_profile: minimax_m27_default
      judge_skill_guide:
        provider: minimax
        model_profile: minimax_m27_default
      judge_vote_tally:
        provider: minimax
        model_profile: minimax_m27_default
      judge_exile:
        provider: minimax
        model_profile: minimax_m27_default
      judge_sheriff:
        provider: minimax
        model_profile: minimax_m27_default
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  # Backward-compatible aliases used by older tests/docs.
  pro_reasoner:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
      speech:
        provider: minimax
        model_profile: minimax_m27_default
      # Phase 2 P2-2: see comment in minimax_default above
      judge_vote_calling:
        provider: minimax
        model_profile: minimax_m27_default
      judge_skill_guide:
        provider: minimax
        model_profile: minimax_m27_default
      judge_vote_tally:
        provider: minimax
        model_profile: minimax_m27_default
      judge_exile:
        provider: minimax
        model_profile: minimax_m27_default
      judge_sheriff:
        provider: minimax
        model_profile: minimax_m27_default
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  local_wolf:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      deception:
        provider: minimax
        model_profile: minimax_m27_fast
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  balanced:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      night_action:
        provider: minimax
        model_profile: minimax_m27_default
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

players:
  p01:
    persona_id: logic_leader
    llm_profile: minimax_default
  p02:
    persona_id: aggressive_bluffer
    llm_profile: minimax_default
  p03:
    persona_id: steady_sider
    llm_profile: ark_glm
  p04:
    persona_id: bold_pretender
    llm_profile: minimax_default
  p05:
