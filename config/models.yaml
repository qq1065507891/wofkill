# V1 real-run model routing.
# Provider/model names are configuration only. API keys stay in .env.

model_profiles:
  minimax_m27_default:
    provider: anthropic
    model: MiniMax-M2.7
    temperature: 0.5
    max_tokens: 1024
    top_p: 0.9
    timeout: 60

  minimax_m27_reflection:
    provider: anthropic
    model: MiniMax-M2.7
    temperature: 0.4
    max_tokens: 2048
    top_p: 0.9
    timeout: 90

  minimax_m27_fast:
    provider: anthropic
    model: MiniMax-M2.7
    temperature: 0.7
    max_tokens: 768
    top_p: 0.95
    timeout: 45

llm_profiles:
  minimax_default:
    default:
      provider: anthropic
      model_profile: minimax_m27_default
    tasks:
      reflection:
        provider: anthropic
        model_profile: minimax_m27_reflection
      speech:
        provider: anthropic
        model_profile: minimax_m27_default
      deception:
        provider: anthropic
        model_profile: minimax_m27_fast
      night_action:
        provider: anthropic
        model_profile: minimax_m27_default
    fallback:
      provider: anthropic
      model_profile: minimax_m27_fast

  # Backward-compatible aliases used by older tests/docs.
  pro_reasoner:
    default:
      provider: anthropic
      model_profile: minimax_m27_default
    tasks:
      reflection:
        provider: anthropic
        model_profile: minimax_m27_reflection
      speech:
        provider: anthropic
        model_profile: minimax_m27_default
    fallback:
      provider: anthropic
      model_profile: minimax_m27_fast

  local_wolf:
    default:
      provider: anthropic
      model_profile: minimax_m27_default
    tasks:
      deception:
        provider: anthropic
        model_profile: minimax_m27_fast
    fallback:
      provider: anthropic
      model_profile: minimax_m27_fast

  balanced:
    default:
      provider: anthropic
      model_profile: minimax_m27_default
    tasks:
      night_action:
        provider: anthropic
        model_profile: minimax_m27_default
      reflection:
        provider: anthropic
        model_profile: minimax_m27_reflection
    fallback:
      provider: anthropic
      model_profile: minimax_m27_fast

