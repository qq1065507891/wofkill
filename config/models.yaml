# V1 real-run model routing.
# Provider/model names are configuration only. API keys stay in .env.

model_profiles:
  # --- Baidu Coding Plan models (OpenAI-compatible) ---
  baidu_deepseek_v3:
    provider: openai
    model: deepseek-v3.2
    temperature: 0.5
    max_tokens: 1024
    top_p: 0.9
    timeout: 120
    allow_text_tool_fallback: true

  baidu_minimax_m25:
    provider: openai
    model: minimax-m2.5
    temperature: 0.5
    max_tokens: 1024
    top_p: 0.9
    timeout: 120
    allow_text_tool_fallback: true

  baidu_glm5:
    provider: openai
    model: glm-5
    temperature: 0.5
    max_tokens: 1024
    top_p: 0.9
    timeout: 120
    allow_text_tool_fallback: true

  baidu_kimi_k25:
    provider: openai
    model: kimi-k2.5
    temperature: 0.5
    max_tokens: 1024
    top_p: 0.9
    timeout: 120
    allow_text_tool_fallback: true

  # --- MiniMax (Anthropic-compatible) ---
  minimax_m27_default:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.5
    max_tokens: 1024
    top_p: 0.9
    timeout: 120
    allow_text_tool_fallback: true

  minimax_m27_reflection:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.4
    max_tokens: 2048
    top_p: 0.9
    timeout: 180
    allow_text_tool_fallback: true

  minimax_m27_fast:
    provider: minimax
    model: MiniMax-M2.7
    temperature: 0.7
    max_tokens: 768
    top_p: 0.95
    timeout: 90
    allow_text_tool_fallback: true

llm_profiles:
  # --- Baidu Coding Plan profiles ---
  baidu_deepseek:
    default:
      provider: openai
      model_profile: baidu_deepseek_v3
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  baidu_minimax:
    default:
      provider: openai
      model_profile: baidu_minimax_m25
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  baidu_glm:
    default:
      provider: openai
      model_profile: baidu_glm5
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  baidu_kimi:
    default:
      provider: openai
      model_profile: baidu_kimi_k25
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  # --- MiniMax profiles ---
  minimax_default:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
      speech:
        provider: minimax
        model_profile: minimax_m27_default
      deception:
        provider: minimax
        model_profile: minimax_m27_fast
      night_action:
        provider: minimax
        model_profile: minimax_m27_default
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  # Backward-compatible aliases used by older tests/docs.
  pro_reasoner:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
      speech:
        provider: minimax
        model_profile: minimax_m27_default
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  local_wolf:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      deception:
        provider: minimax
        model_profile: minimax_m27_fast
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

  balanced:
    default:
      provider: minimax
      model_profile: minimax_m27_default
    tasks:
      night_action:
        provider: minimax
        model_profile: minimax_m27_default
      reflection:
        provider: minimax
        model_profile: minimax_m27_reflection
    fallback:
      provider: minimax
      model_profile: minimax_m27_fast

players:
  p01:
    persona_id: logic_leader
    llm_profile: baidu_deepseek
  p02:
    persona_id: aggressive_bluffer
    llm_profile: minimax_default
  p03:
    persona_id: steady_sider
    llm_profile: baidu_glm
  p04:
    persona_id: bold_pretender
    llm_profile: minimax_default
  p05:
    persona_id: deep_hooker
    llm_profile: baidu_minimax
  p06:
    persona_id: emotional_catalyst
    llm_profile: minimax_default
  p07:
    persona_id: chaos_joker
    llm_profile: baidu_kimi
  p08:
    persona_id: review_learner
    llm_profile: minimax_default
  p09:
    persona_id: quiet_observer
    llm_profile: baidu_deepseek
  p10:
    persona_id: burst_visionary
    llm_profile: minimax_default
  p11:
    persona_id: structure_analyst
    llm_profile: baidu_glm
  p12:
    persona_id: adaptive_gamer
    llm_profile: minimax_default
  judge:
    persona_id: judge
    llm_profile: minimax_default
