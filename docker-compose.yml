services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - werewolf-data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - WEREWOLF_DB_PATH=/app/data/wofkill.db
      - WEREWOLF_AUTH_SECRET=${WEREWOLF_AUTH_SECRET:-wofkill-dev-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/games')"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    profiles:
      - with-redis
      - production-adapters

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=wofkill
      - POSTGRES_USER=wofkill
      - POSTGRES_PASSWORD=wofkill-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - production-adapters

  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    profiles:
      - production-adapters

volumes:
  werewolf-data:
  redis-data:
  postgres-data:
  qdrant-data:
